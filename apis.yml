aid: tomtom
name: TomTom
description: >-
  TomTom provides a comprehensive suite of location technology APIs and SDKs including maps, search, routing, traffic,
  navigation, and automotive data services. The TomTom developer platform is trusted by major automotive manufacturers,
  logistics companies, and application developers. APIs cover real-time traffic incidents and flow, route calculation,
  geocoding, points of interest search, geofencing, parking availability, fuel prices, and electric vehicle routing.
  TomTom also provides an MCP Server for AI integration with location intelligence.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/tomtom.png
